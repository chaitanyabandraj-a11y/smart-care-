<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="apolloBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="apolloFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#apolloBlue)" stroke="#38bdf8" stroke-width="2" />
  
  <!-- Apollo Torch & Healing Hands Motif -->
  <g transform="translate(50, 44)">
    <!-- Torch Base -->
    <path d="M-6,20 L6,20 L4,32 L-4,32 Z" fill="#94a3b8" />
    <path d="M-9,16 L9,16 L6,20 L-6,20 Z" fill="#cbd5e1" />
    
    <!-- Torch Flame -->
    <path d="M0,-24 C8,-16 16,-8 12,4 C10,12 2,16 0,16 C-2,16 -10,12 -12,4 C-16,-8 -8,-16 0,-24 Z" fill="url(#apolloFlame)" />
    <!-- Inner Flame Glow -->
    <path d="M0,-16 C4,-10 8,-4 6,4 C4,8 0,10 0,10 C0,10 -4,8 -6,4 C-8,-4 -4,-10 0,-16 Z" fill="#fef08a" />
    
    <!-- Protective Healing Arcs -->
    <path d="M-22,6 C-26,-2 -24,-14 -16,-20" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <path d="M22,6 C26,-2 24,-14 16,-20" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  </g>
  
  <!-- Apollo Typography Banner -->
  <text x="50" y="86" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="10" fill="#f8fafc" letter-spacing="1.5">APOLLO</text>
</svg>
