      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#ambGrad)" stroke="#38bdf8" stroke-width="2" />
  
  <g transform="translate(50, 48)">
