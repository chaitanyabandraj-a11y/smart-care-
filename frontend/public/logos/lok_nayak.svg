<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="lnjpBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#lnjpBlue)" stroke="#67e8f9" stroke-width="2" />
  
  <!-- Lok Nayak / MAMC Government Shield -->
  <g transform="translate(50, 44)">
    <!-- Shield Outline -->
    <path d="M-22,-20 L22,-20 L22,4 C22,18 0,26 0,26 C0,26 -22,18 -22,4 Z" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="2" />
    
    <!-- Red Cross Center -->
    <path d="M-4,-14 L4,-14 L4,-6 L12,-6 L12,2 L4,2 L4,10 L-4,10 L-4,2 L-12,2 L-12,-6 L-4,-6 Z" fill="#ef4444" />
    
    <!-- Caduceus Serpent Wing -->
    <circle cx="0" cy="-14" r="3" fill="#f59e0b" />
    <!-- Wheat sheaf / laurel -->
    <path d="M-16,14 C-12,20 -4,22 0,22" fill="none" stroke="#fef08a" stroke-width="2" />
    <path d="M16,14 C12,20 4,22 0,22" fill="none" stroke="#fef08a" stroke-width="2" />
  </g>
  
  <text x="50" y="86" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="9" fill="#f8fafc" letter-spacing="1">LOK NAYAK</text>
</svg>
